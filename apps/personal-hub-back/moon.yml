project:
  name: 'PersonalHub Back'
  description: 'Backend for personal hub management'

language: go

tasks:
  build:
    command: 'go build -o build'
    inputs:
      - 'src/**/*'
    outputs:
      - 'build'
  dev:
    command:  'go run src/main.go'
  test:
    command: 'go test ./... -coverprofile=coverage.out -covermode=atomic'
    inputs:
      - 'src/**/*'  